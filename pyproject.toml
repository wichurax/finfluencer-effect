[project]
name = "finfluencer-effect"
version = "0.1.0"
description = "Event study: do finance YouTubers' bullish/bearish calls move the stocks they talk about?"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.16.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "pyarrow>=26.0.0",
    "scipy>=1.18.1",
    "statsmodels>=0.15.0",
    "yfinance>=1.7.0",
    "yt-dlp>=2026.8.19",
    "yt-dlp-ejs>=0.8.0",
]

[project.scripts]
finfluencer = "finfluencer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finfluencer"]
